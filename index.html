<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yihe Lin · Visual Designer</title>
<meta name="description" content="A profile page seen from under a glass table: cat paws press on touch-sensing glass, and only the spots they touch light up.">
<meta name="theme-color" content="#0A0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{--accent:#8FD3FF;--bg:#0A0B0D;--ink:#F2F3F5;--mute:#8A9099}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
a{color:var(--ink)}a:hover{color:#FFFFFF}

.stage{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:88px 16px 120px}
.layer{position:absolute;inset:0;pointer-events:none}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.dots{background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.4px);background-size:22px 22px}
.glass{-webkit-backdrop-filter:blur(22px) saturate(120%);backdrop-filter:blur(22px) saturate(120%)}
.fa{fill:var(--accent)}

/* ---------- paw contact animation ---------- */
.leg,.hudwrap{position:absolute;width:0;height:0}
.leg *,.hudwrap *{animation-duration:inherit;animation-delay:inherit}
.a{animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.3,0,.25,1)}
.leg.k .a{animation-timing-function:ease-in-out}
.toe1,.toe2,.toe3,.toe4,.main{transform-box:fill-box;transform-origin:50% 50%}
.res{opacity:0}.far{opacity:.3}.core{opacity:.6}.glow{opacity:.7}
.p .limb{animation-name:p-limb}.k .limb{animation-name:k-limb}
.p .far{animation-name:p-far}.k .far{animation-name:k-far}
.p .near{animation-name:p-near}.k .near{animation-name:k-near}
.p .toe1{animation-name:p-t1}.k .toe1{animation-name:k-t1}
.p .toe2{animation-name:p-t2}.k .toe2{animation-name:k-t2}
.p .toe3{animation-name:p-t3}.k .toe3{animation-name:k-t3}
.p .toe4{animation-name:p-t4}.k .toe4{animation-name:k-t4}
.p .main{animation-name:p-main}.k .main{animation-name:k-main}
.p .core{animation-name:p-core}.k .core{animation-name:k-core}
.p .glow{animation-name:p-glow}.k .glow{animation-name:k-glow}
.p .res{animation-name:p-res}.k .res{animation-name:k-res}
.hud{animation-name:hud}
.hud-label{animation-name:hudFade}
.p .pbar{animation-name:p-bar}.k .pbar{animation-name:k-bar}
.hudwrap .type{display:block;overflow:hidden;white-space:nowrap;max-width:22ch;animation-name:type;animation-timing-function:steps(22,end)}

/* ---------- name glitch ---------- */
.glitch{position:relative;animation:glMain 7s steps(1,end) infinite}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;color:var(--ink)}
.glitch::before{text-shadow:-3px 0 rgba(143,211,255,.85);animation:gl1 7s steps(1,end) infinite}
.glitch::after{text-shadow:3px 0 rgba(255,255,255,.45);animation:gl2 7s steps(1,end) infinite}
@keyframes glMain{0%,90%{opacity:1}91%{opacity:.35}94%{opacity:.8}95%,100%{opacity:1}}
@keyframes gl1{0%,90%{opacity:0;transform:translate(0px,0px);clip-path:inset(0 0 100% 0)}91%{opacity:1;transform:translate(-6px,0px);clip-path:inset(12% 0 62% 0)}92.5%{opacity:1;transform:translate(5px,0px);clip-path:inset(48% 0 30% 0)}94%{opacity:1;transform:translate(-3px,0px);clip-path:inset(76% 0 4% 0)}95%,100%{opacity:0;transform:translate(0px,0px);clip-path:inset(0 0 100% 0)}}
@keyframes gl2{0%,90.5%{opacity:0;transform:translate(0px,0px);clip-path:inset(0 0 100% 0)}91.5%{opacity:1;transform:translate(7px,0px);clip-path:inset(30% 0 50% 0)}93%{opacity:1;transform:translate(-4px,0px);clip-path:inset(62% 0 16% 0)}94.5%,100%{opacity:0;transform:translate(0px,0px);clip-path:inset(0 0 100% 0)}}

/* ---------- small UI ---------- */
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.eq{display:block;width:2px;height:12px;background:var(--accent);transform-origin:50% 100%;transform:scaleY(.25)}
.eq.on{animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.icon-btn,.cta,.snd{transition:transform .2s ease,background-color .2s ease,border-color .2s ease}
.icon-btn:hover,.snd:hover{border-color:rgba(255,255,255,.3)}
.icon-btn:hover,.cta:hover{transform:translateY(-1px)}
.icon-btn:focus-visible,.cta:focus-visible,.snd:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.corner{position:absolute;z-index:4;margin:0;font-size:10px;letter-spacing:.2em;color:var(--mute)}
.card{position:relative;z-index:4;width:100%;max-width:460px;background:rgba(16,18,22,.62);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:8px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;color:#E6E8EB}
.cta{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.04em}
.cta:hover{color:var(--bg)}
.snd{position:absolute;z-index:5;right:24px;bottom:14px;min-height:44px;display:inline-flex;align-items:center;gap:10px;padding:0 16px;background:rgba(16,18,22,.7);border:1px solid rgba(255,255,255,.1);border-radius:999px;color:#E6E8EB;font-size:10px;letter-spacing:.2em;cursor:pointer}

@media (max-width:560px){
  .stage{padding:72px 16px 104px}
  .name{font-size:52px!important}
}
@media (prefers-reduced-motion: reduce){
  .leg .a,.hudwrap .a{animation-name:none}
  .glitch,.glitch::before,.glitch::after,.pulse,.eq.on{animation:none}
}
</style>
</head>
<body>
<div class="stage">

  <div class="layer" aria-hidden="true" style="z-index:0">
    <div style="position:absolute;left:15%;top:10%;width:70%;height:80%;border-radius:50%;background:#171A1F;filter:blur(120px)"></div>
    <div class="dots" style="position:absolute;inset:0"></div>
  </div>

  <!-- paws pressing on the glass, generated by the script below -->
  <div class="layer" id="paws" aria-hidden="true" style="z-index:1"></div>

  <div class="layer" aria-hidden="true" style="z-index:2">
    <div style="position:absolute;top:-30%;left:58%;width:12%;height:160%;background:rgba(255,255,255,.025);transform:rotate(22deg);filter:blur(30px)"></div>
    <div style="position:absolute;top:-30%;left:73%;width:3%;height:160%;background:rgba(255,255,255,.03);transform:rotate(22deg);filter:blur(12px)"></div>
    <svg width="100%" height="100%" style="position:absolute;inset:0;opacity:.07;mix-blend-mode:screen">
      <filter id="frost-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
      <rect width="100%" height="100%" filter="url(#frost-grain)"></rect>
    </svg>
  </div>

  <!-- focus brackets and readouts, generated by the script below -->
  <div class="layer" id="huds" aria-hidden="true" style="z-index:3"></div>

  <p class="corner mono" style="left:24px;top:22px">YIHE LIN — ©2026</p>
  <p class="corner mono" style="right:24px;top:22px">CALIFORNIA <span id="clock" style="color:var(--ink)">--:--:--</span></p>

  <main class="card glass">
    <img src="assets/night.jpg" alt="A black cat sitting on a rainy window sill with its back to the camera, looking out at blurred city lights" width="1272" height="600" style="display:block;width:100%;height:210px;object-fit:cover;border-radius:13px">

    <div style="padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px">
      <div class="mono" style="display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:10px;letter-spacing:.18em;color:var(--mute)">
        <span>№ 07 — VISUAL DESIGNER</span>
        <span>EST. 2017</span>
      </div>
      <h1 class="glitch name" data-text="YIHE LIN" style="margin:0;font-family:'Anton','Noto Sans SC',sans-serif;font-weight:400;font-size:64px;line-height:.95;letter-spacing:.01em;color:var(--ink)">YIHE LIN</h1>
      <p class="mono" style="margin:0;font-size:11px;letter-spacing:.42em;color:var(--mute)">BRANDS · BOOKS · TYPE</p>
      <p style="margin:6px 0 0;font-size:13px;line-height:1.9;font-weight:300;color:#A6ABB2">Visual designer. A few brands and books a year, made slowly.<br>No trends. No rush jobs.<br>Studio staff: me, and a black cat who mostly ignores me.</p>
    </div>

    <div style="height:1px;background:rgba(255,255,255,.08);margin:0 8px"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 10px 4px">
      <div style="display:flex;gap:6px">
        <a class="icon-btn" href="#" aria-label="Email"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m3.5 7 8.5 6 8.5-6"></path></svg></a>
        <a class="icon-btn" href="#" aria-label="Xiaohongshu"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c2.5-1 5.5-1 9 1 3.5-2 6.5-2 9-1v13c-2.5-1-5.5-1-9 1-3.5-2-6.5-2-9-1z"></path><path d="M12 6.5v13"></path></svg></a>
        <a class="icon-btn" href="#" aria-label="Portfolio"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg></a>
      </div>
      <a class="cta" href="#">Work with me<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg></a>
    </div>
  </main>

  <p class="corner mono" style="left:24px;bottom:30px;display:flex;align-items:center;gap:10px"><span class="pulse" style="width:6px;height:6px;border-radius:50%;background:var(--accent)"></span>PAW-SENSE GLASS / LIVE</p>

  <button class="snd glass mono" id="sound" type="button" aria-pressed="false">
    <span aria-hidden="true" style="display:inline-flex;align-items:flex-end;gap:2px;height:12px">
      <span class="eq" style="animation-delay:-.1s"></span>
      <span class="eq" style="animation-delay:-.55s"></span>
      <span class="eq" style="animation-delay:-.3s"></span>
      <span class="eq" style="animation-delay:-.8s"></span>
    </span>
    <span>SOUND</span>
    <span id="soundState" aria-hidden="true" style="color:var(--mute)">OFF</span>
  </button>

</div>

<script>
(function () {
  'use strict';

  // Optional overrides: ?accent=c8ff3d  ?hud=0
  var params = new URLSearchParams(location.search);
  var accentParam = params.get('accent');
  if (accentParam && /^[0-9a-fA-F]{6}$/.test(accentParam)) {
    document.documentElement.style.setProperty('--accent', '#' + accentParam);
  }
  var showHud = params.get('hud') !== '0';

  // Where each paw lands. dir = direction the cat's body lies from the paw (deg),
  // motion: 'p' = press, 'k' = knead. note = pitch of the glass ping (Hz).
  var LEGS = [
    { x: 74, y: 20, dir: -48,  dur: 12,   delay: -1.0,  motion: 'k', label: 'CONTACT 01 / KNEAD',   kg: '1.2', note: 880 },
    { x: 83, y: 37, dir: -14,  dur: 12,   delay: -0.46, motion: 'k', label: 'CONTACT 02 / KNEAD',   kg: '1.1', note: 1046.5 },
    { x: 8,  y: 58, dir: -150, dur: 10.4, delay: -6.2,  motion: 'p', label: 'CONTACT 03 / FRONT L', kg: '0.9', note: 659.25 },
    { x: 42, y: 93, dir: 96,   dur: 11.6, delay: -3.4,  motion: 'p', label: 'CONTACT 04 / HIND L',  kg: '0.8', note: 587.33 },
    { x: 55, y: 96, dir: 82,   dur: 11.6, delay: -9.2,  motion: 'p', label: 'CONTACT 05 / HIND R',  kg: '0.8', note: 783.99 },
    { x: 24, y: 10, dir: -112, dur: 13.8, delay: -11.5, motion: 'p', label: 'CONTACT 06 / FRONT R', kg: '0.7', note: 1174.66 },
    { x: 88, y: 76, dir: 24,   dur: 15,   delay: -7.0,  motion: 'p', label: 'CONTACT 07 / STEP',    kg: '0.6', note: 1318.51 }
  ];

  var PAD_MAIN = 'M50 52C62 52 73 63 74.5 73.5C75.8 83 68.5 88.5 59.8 85.4C55.6 83.9 53 82.2 50 82.2C47 82.2 44.4 83.9 40.2 85.4C31.5 88.5 24.2 83 25.5 73.5C27 63 38 52 50 52Z';
  var TOES = [
    { cx: 21,   cy: 47, r: -32, ccx: 21.4, ccy: 46.4 },
    { cx: 37.5, cy: 30, r: -11, ccx: 37.7, ccy: 29.4 },
    { cx: 62.5, cy: 30, r: 11,  ccx: 62.3, ccy: 29.4 },
    { cx: 79,   cy: 47, r: 32,  ccx: 78.6, ccy: 46.4 }
  ];
  var RES_TOES = [[19, 46.3, -32], [36.8, 28.2, -11], [63.2, 28.2, 11], [81, 46.3, 32]];

  function timing(l) {
    return 'left:' + l.x + '%;top:' + l.y + '%;animation-duration:' + l.dur + 's;animation-delay:' + l.delay + 's';
  }

  function pawHTML(l) {
    var res = RES_TOES.map(function (t) {
      return '<ellipse cx="' + t[0] + '" cy="' + t[1] + '" rx="9.4" ry="12" transform="rotate(' + t[2] + ' ' + t[0] + ' ' + t[1] + ')"></ellipse>';
    }).join('');
    var glowToes = RES_TOES.map(function (t) {
      return '<ellipse cx="' + t[0] + '" cy="' + t[1] + '" rx="10" ry="12.6" transform="rotate(' + t[2] + ' ' + t[0] + ' ' + t[1] + ')"></ellipse>';
    }).join('');
    var toes = TOES.map(function (t, i) {
      return '<g class="a toe' + (i + 1) + '">' +
        '<ellipse class="fa" cx="' + t.cx + '" cy="' + t.cy + '" rx="9.2" ry="11.8" transform="rotate(' + t.r + ' ' + t.cx + ' ' + t.cy + ')"></ellipse>' +
        '<ellipse class="a core" cx="' + t.ccx + '" cy="' + t.ccy + '" rx="5" ry="6.8" transform="rotate(' + t.r + ' ' + t.ccx + ' ' + t.ccy + ')" fill="#FFFFFF"></ellipse>' +
        '</g>';
    }).join('');
    var box = 'position:absolute;left:-44px;top:-52px;width:88px;height:97px';
    return '<div class="leg ' + l.motion + '" style="' + timing(l) + '">' +
      '<div style="position:absolute;left:0;top:0;width:0;height:0;transform:rotate(' + (l.dir - 90) + 'deg)">' +
        // afterglow left on the glass
        '<div class="a res" style="' + box + ';filter:blur(2.4px)"><svg width="88" height="97" viewBox="0 0 100 110" style="display:block"><g class="fa">' + res + '<path d="' + PAD_MAIN + '"></path></g></svg></div>' +
        '<div class="a limb" style="position:absolute;left:0;top:0;width:0;height:0">' +
          // body and leg, far from the glass so heavily blurred
          '<div style="position:absolute;left:-170px;top:250px;width:340px;height:300px;border-radius:50%;background:#2E343C;opacity:.35;filter:blur(52px)"></div>' +
          '<div style="position:absolute;left:-52px;top:4px;width:104px;height:400px;border-radius:52px;background:#343A43;opacity:.42;filter:blur(26px)"></div>' +
          '<div style="position:absolute;left:-32px;top:18px;width:64px;height:200px;border-radius:32px;background:#3E454F;opacity:.45;filter:blur(15px)"></div>' +
          '<div class="a far" style="position:absolute;left:-54px;top:-58px;width:108px;height:118px;border-radius:50%;background:#4A525C;filter:blur(16px)"></div>' +
          // fur around the pads, close to the glass
          '<div class="a near" style="' + box + '"><svg width="88" height="97" viewBox="0 0 100 110" style="display:block;overflow:visible"><g fill="#3A4048">' +
            '<circle cx="21" cy="47" r="15"></circle><circle cx="37.5" cy="30" r="15"></circle><circle cx="62.5" cy="30" r="15"></circle><circle cx="79" cy="47" r="15"></circle>' +
            '<ellipse cx="50" cy="52" rx="30" ry="20"></ellipse><ellipse cx="50" cy="71" rx="34" ry="27"></ellipse>' +
          '</g></svg></div>' +
          // light bleeding into the frosted glass
          '<div class="a glow" style="' + box + '">' +
            '<div style="position:absolute;left:-36px;top:-36px;width:160px;height:170px;border-radius:50%;background:var(--accent);opacity:.2;filter:blur(36px)"></div>' +
            '<div style="position:absolute;left:0;top:0;width:88px;height:97px;opacity:.9;filter:blur(8px)"><svg width="88" height="97" viewBox="0 0 100 110" style="display:block"><g class="fa">' + glowToes + '<ellipse cx="50" cy="70" rx="26" ry="19"></ellipse></g></svg></div>' +
          '</div>' +
          // the pads in contact with the glass
          '<svg width="88" height="97" viewBox="0 0 100 110" style="' + box + ';overflow:visible;filter:blur(.5px)">' + toes +
            '<g class="a main"><path class="fa" d="' + PAD_MAIN + '"></path><ellipse class="a core" cx="50" cy="70.5" rx="14" ry="8.8" fill="#FFFFFF"></ellipse></g>' +
          '</svg>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function hudHTML(l) {
    var c = 'position:absolute;width:12px;height:12px;';
    var line = '1px solid rgba(255,255,255,.6)';
    var labelX = l.x > 60 ? -228 : 68;
    return '<div class="hudwrap ' + l.motion + '" style="' + timing(l) + '">' +
      '<div class="a hud" style="position:absolute;left:-58px;top:-58px;width:116px;height:116px">' +
        '<div style="' + c + 'left:0;top:0;border-top:' + line + ';border-left:' + line + '"></div>' +
        '<div style="' + c + 'right:0;top:0;border-top:' + line + ';border-right:' + line + '"></div>' +
        '<div style="' + c + 'left:0;bottom:0;border-bottom:' + line + ';border-left:' + line + '"></div>' +
        '<div style="' + c + 'right:0;bottom:0;border-bottom:' + line + ';border-right:' + line + '"></div>' +
        '<div style="position:absolute;left:57px;top:52px;width:1px;height:11px;background:rgba(255,255,255,.35)"></div>' +
        '<div style="position:absolute;left:52px;top:57px;width:11px;height:1px;background:rgba(255,255,255,.35)"></div>' +
      '</div>' +
      '<div class="a hud-label mono" style="position:absolute;top:-72px;left:' + labelX + 'px;width:160px;display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:1.3;letter-spacing:.06em">' +
        '<span class="a type" style="color:var(--accent);font-weight:500">' + l.label + '</span>' +
        '<span style="color:var(--mute);font-size:10px">PRESSURE ' + l.kg + ' KG</span>' +
        '<div style="width:120px;height:2px;background:rgba(255,255,255,.1);overflow:hidden"><div class="a pbar" style="height:2px;width:78%;background:var(--accent)"></div></div>' +
      '</div>' +
    '</div>';
  }

  document.getElementById('paws').innerHTML = LEGS.map(pawHTML).join('');
  if (showHud) document.getElementById('huds').innerHTML = LEGS.map(hudHTML).join('');
  var mountAt = performance.now();

  // ---------- California clock ----------
  var clockEl = document.getElementById('clock');
  function tick() {
    try {
      clockEl.textContent = new Date().toLocaleTimeString('en-GB', { timeZone: 'America/Los_Angeles', hour12: false });
    } catch (e) {}
  }
  tick();
  setInterval(tick, 1000);

  // ---------- sound: everything is synthesized live with Web Audio ----------
  var audio = null;
  var soundOn = false;
  var phases = [];
  var suspendTimer = null;
  var btn = document.getElementById('sound');
  var stateEl = document.getElementById('soundState');
  var eqs = btn.querySelectorAll('.eq');

  function setupAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = new AC();
    var master = ctx.createGain();
    master.gain.value = 0;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 3;
    comp.attack.value = 0.02; comp.release.value = 0.4;
    comp.connect(master);
    master.connect(ctx.destination);

    var dry = ctx.createGain();
    dry.gain.value = 0.75;
    dry.connect(comp);

    // long, dark reverb from a decaying noise impulse
    var rev = ctx.createConvolver();
    var len = Math.floor(ctx.sampleRate * 4.5);
    var ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var d = ir.getChannelData(ch);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    rev.buffer = ir;
    var wet = ctx.createGain();
    wet.gain.value = 0.5;
    rev.connect(wet);
    wet.connect(comp);

    // pad: detuned saws + triangles through a slowly breathing low-pass
    var padF = ctx.createBiquadFilter();
    padF.type = 'lowpass'; padF.frequency.value = 650; padF.Q.value = 0.7;
    var lfo = ctx.createOscillator();
    lfo.frequency.value = 0.045;
    var lfoG = ctx.createGain();
    lfoG.gain.value = 300;
    lfo.connect(lfoG); lfoG.connect(padF.frequency); lfo.start();
    var pad = ctx.createGain();
    pad.gain.value = 0.11;
    padF.connect(pad); pad.connect(dry); pad.connect(rev);

    // sub bass
    var sub = ctx.createOscillator();
    sub.type = 'sine'; sub.frequency.value = 55;
    var subG = ctx.createGain();
    subG.gain.value = 0.06;
    sub.connect(subG); subG.connect(dry); sub.start();

    // rain: band-passed noise
    var nb = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
    var nd = nb.getChannelData(0);
    for (var j = 0; j < nd.length; j++) nd[j] = Math.random() * 2 - 1;
    var noise = ctx.createBufferSource();
    noise.buffer = nb; noise.loop = true;
    var nf = ctx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 2200; nf.Q.value = 0.4;
    var ng = ctx.createGain();
    ng.gain.value = 0.025;
    noise.connect(nf); nf.connect(ng); ng.connect(dry); noise.start();

    audio = { ctx: ctx, master: master, dry: dry, rev: rev, padF: padF, sub: sub, chord: 0, voices: [] };
    playChord(true);
    setInterval(function () { playChord(false); }, 14000);
    setInterval(checkPaws, 40);
  }

  var CHORDS = [
    [110, 164.81, 196.0, 246.94, 329.63],   // Am9
    [87.31, 130.81, 164.81, 220.0, 246.94], // Fmaj7#11
    [130.81, 196.0, 246.94, 293.66, 329.63],// Cmaj9
    [98.0, 146.83, 196.0, 220.0, 293.66]    // G6/9
  ];

  function playChord(force) {
    if (!audio || (!force && !soundOn)) return;
    var ctx = audio.ctx;
    var t = ctx.currentTime;
    var notes = CHORDS[audio.chord % CHORDS.length];
    audio.chord += 1;
    audio.sub.frequency.setTargetAtTime(notes[0] / 2, t, 2);
    audio.voices.forEach(function (v) {
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setValueAtTime(v.g.gain.value, t);
      v.g.gain.linearRampToValueAtTime(0, t + 5);
      v.oscs.forEach(function (o) { o.stop(t + 5.2); });
    });
    audio.voices = notes.map(function (f, i) {
      var g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i === 0 ? 0.5 : 0.32, t + 5);
      var o1 = ctx.createOscillator();
      o1.type = 'sawtooth'; o1.frequency.value = f; o1.detune.value = -7;
      var o2 = ctx.createOscillator();
      o2.type = 'triangle'; o2.frequency.value = f; o2.detune.value = 6;
      o1.connect(g); o2.connect(g); g.connect(audio.padF);
      o1.start(t); o2.start(t);
      return { g: g, oscs: [o1, o2] };
    });
  }

  // glass ping when a paw touches down, panned to where it lands
  function ping(freq, vel, panX) {
    var ctx = audio.ctx;
    var t = ctx.currentTime + 0.01;
    var out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.1 * vel, t + 0.012);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    var o1 = ctx.createOscillator();
    o1.type = 'sine'; o1.frequency.value = freq;
    var o2 = ctx.createOscillator();
    o2.type = 'sine'; o2.frequency.value = freq * 2.76;
    var g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.35, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o1.connect(out); o2.connect(g2); g2.connect(out);
    var node = out;
    if (ctx.createStereoPanner) {
      var pan = ctx.createStereoPanner();
      pan.pan.value = Math.max(-0.9, Math.min(0.9, panX / 50 - 1));
      out.connect(pan);
      node = pan;
    }
    var dryG = ctx.createGain();
    dryG.gain.value = 0.45;
    node.connect(dryG); dryG.connect(audio.dry); node.connect(audio.rev);
    o1.start(t); o2.start(t); o1.stop(t + 3); o2.stop(t + 3);
  }

  // soft low thump when the paw presses down
  function thump(vel) {
    var ctx = audio.ctx;
    var t = ctx.currentTime + 0.01;
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.22);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22 * vel, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(audio.dry);
    o.start(t); o.stop(t + 0.4);
  }

  // keep the sounds in step with the CSS animation timeline
  function checkPaws() {
    if (!audio || !soundOn) return;
    var now = (performance.now() - mountAt) / 1000;
    LEGS.forEach(function (l, i) {
      var ph = ((((now - l.delay) % l.dur) + l.dur) % l.dur) / l.dur;
      var prev = phases[i];
      phases[i] = ph;
      if (prev === undefined) return;
      var hit = function (x) { return prev <= ph ? (prev < x && x <= ph) : (x > prev || x <= ph); };
      if (hit(0.115)) ping(l.note, l.motion === 'k' ? 0.6 : 1, l.x);
      if (l.motion === 'k') {
        [0.17, 0.26, 0.35, 0.44, 0.53].forEach(function (x) { if (hit(x)) thump(0.55); });
      } else if (hit(0.17)) {
        thump(0.8);
      }
    });
  }

  btn.addEventListener('click', function () {
    var on = !soundOn;
    if (on && !audio) setupAudio();
    if (!audio) return;
    var t = audio.ctx.currentTime;
    clearTimeout(suspendTimer);
    audio.master.gain.cancelScheduledValues(t);
    audio.master.gain.setValueAtTime(audio.master.gain.value, t);
    if (on) {
      phases = [];
      audio.ctx.resume();
      audio.master.gain.linearRampToValueAtTime(0.85, t + 2.5);
    } else {
      audio.master.gain.linearRampToValueAtTime(0, t + 0.8);
      var a = audio;
      suspendTimer = setTimeout(function () { try { a.ctx.suspend(); } catch (e) {} }, 900);
    }
    soundOn = on;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    stateEl.textContent = on ? 'ON' : 'OFF';
    for (var k = 0; k < eqs.length; k++) eqs[k].classList.toggle('on', on);
  });
})();
</script>
</body>
</html>
